  <script nonce="sim-gapi-setup">
    function onGapiClientLoad() {
      console.log("GAPI client module (m=client) script finished execution, which called this callback (gapi.loaded_0).");

      // if (window.gapi && window.gapi.client) {

      // }
    }

    function loadGapiClientModule() {
      console.log("GAPI core (api.js) loaded. Dynamically loading GAPI client module.");
      if (!window.gapi) {
        console.error("GAPI core object (window.gapi) not found after api.js load.");
        return;
      }
      // Define the callback that the m=client script will invoke via cb=gapi.loaded_0
      window.gapi.loaded_0 = onGapiClientLoad;

      const gapiClientScript = document.createElement('script');
      // This URL is for the "client" module and specifies "gapi.loaded_0" as its callback name parameter.
      gapiClientScript.src = "https://apis.google.com/_/scs/abc-static/_/js/k=gapi.lb.en.nJpyt-fjzo8.O/m=client/rt=j/sv=1/d=1/ed=1/rs=AHpOoo9fTqXSCmwMDsu9FH68l5KSqr6MBg/cb=gapi.loaded_0?le=scs";
      gapiClientScript.async = true;
      // Try to reuse a nonce or set a specific one. The nonce should match your CSP if you have one.
      const mainGapiNonce = document.querySelector('script[src*="apis.google.com/js/api.js"]')?.getAttribute('nonce');
      gapiClientScript.setAttribute('nonce', mainGapiNonce || 'sim-nonce-gapi-client-dynamic');
      document.head.appendChild(gapiClientScript);
    }
  </script>
